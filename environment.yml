name: pocketvec-tcruzi
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.10
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - biopython>=1.80
  - openbabel>=3.1.1
  - pyyaml>=6.0
  - requests>=2.28
  - tqdm>=4.60
  - matplotlib>=3.7
  # External structural-biology tools (see README for versions used)
  - rdock
  - fpocket>=4.0
  - blast>=2.12
  - openjdk>=17          # required by P2Rank
  # MAGL case study and notebooks
  - pymol-open-source
  - jupyterlab
  - ipywidgets>=8.0
  - plotly>=5.0
  - rdkit>=2022.09
  - pip
  - pip:
      - biobb_structure_checking
      - py3Dmol>=2.0
